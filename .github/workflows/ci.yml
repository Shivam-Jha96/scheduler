name: CI — SchedulerBot Model C v4.4 HYBRID

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    name: Build, Typecheck, Guardrails & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: M0-T4 / EP12-G2 Forbidden V1.2 & SQL Guardrails
        run: npm run lint:v12-guard

      - name: Build all Turborepo workspaces
        run: npm run build

      - name: Typecheck all Turborepo workspaces
        run: npm run typecheck

      - name: Run Vitest & workspace tests
        run: npm test
