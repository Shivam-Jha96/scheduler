# ==============================================================================
# Grafana Loki Configuration - Tier 3 30-Day Ephemeral Retention
# Lean VPS Logging (EP14-T3 / BR-05 Tier 3 30-Day Log TTL)
# ==============================================================================
# Enforces strict 30-day (720h) ephemeral log expiration across the compactor
# and table manager. Logs older than 30 days are automatically purged.
# ==============================================================================

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ------------------------------------------------------------------------------
# Compactor: Tier-3 30-Day Retention Enforcement Engine (BR-05)
# ------------------------------------------------------------------------------
compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# ------------------------------------------------------------------------------
# Limits: Strict 30-Day (720h) Retention Period
# ------------------------------------------------------------------------------
limits_config:
  retention_period: 720h              # Exactly 30 Days (Tier-3 Ephemeral Policy)
  reject_old_samples: true
  reject_old_samples_max_age: 720h    # 30 Days
  max_query_length: 721h
  max_query_parallelism: 16
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8

# ------------------------------------------------------------------------------
# Table Manager: Legacy & Filesystem Retention Purge Engine
# ------------------------------------------------------------------------------
table_manager:
  retention_deletes_enabled: true
  retention_period: 720h              # Exactly 30 Days
