# ==============================================================================
# pgBackRest Configuration: [scheduler_db] Stanza
# Lean VPS Local/Cold Storage Profile (BO-05 / Zero CapEx / $0.00 R2/S3 Spend)
# ==============================================================================
# Backs up PostgreSQL 16 cluster to local block storage volume (/var/lib/pgbackrest)
# with AES-256-CBC hardware-accelerated encryption and zstandard compression.
# Strictly zero external cloud storage dependencies.
# ==============================================================================

[general]
# AES-256-CBC repository encryption key (override via PGBACKREST_REPO1_CIPHER_PASS)
repo1-cipher-type = aes-256-cbc
repo1-cipher-pass = schedulerbot-prod-repo-encryption-secret-key-change-in-prod

# Local Attached Storage Path (Hetzner Volume or Host Directory)
repo1-path = /var/lib/pgbackrest

# Retention Policy: 14 Full Backups with automatic incremental chaining
repo1-retention-full = 14
repo1-retention-full-type = count

# Compression Settings: Modern Zstandard (zst) for maximum compression ratio & speed
compress-type = zst
compress-level = 3

# Process parallelism tuned for 4-vCPU VPS
process-max = 2

# Logging configuration
log-level-console = info
log-level-file = detail

[scheduler_db]
# PostgreSQL Cluster Connection & Data Directory
pg1-path = /var/lib/postgresql/16/main
pg1-user = postgres
pg1-database = scheduler_db
pg1-socket-path = /var/run/postgresql
pg1-port = 5432
