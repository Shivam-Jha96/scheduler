# ==============================================================================
# PostgreSQL 16 Production Configuration
# Lean VPS Profile (EP14-T1a / EP14-T2 / Hetzner CPX21/CPX31 / 3-4 vCPU, 4-8 GB)
# ==============================================================================

# ------------------------------------------------------------------------------
# Connection & Network Settings (Zero Public Exposure)
# ------------------------------------------------------------------------------
listen_addresses = '127.0.0.1'           # Tailscale IP appended by setup-tailscale.sh
port = 5432
max_connections = 100
superuser_reserved_connections = 3
password_encryption = scram-sha-256
ssl = on
ssl_prefer_server_ciphers = on

# ------------------------------------------------------------------------------
# Extension Preloading & pg_cron Scheduling Engine (EP14-T2)
# ------------------------------------------------------------------------------
shared_preload_libraries = 'pg_cron'
cron.database_name = 'scheduler_db'
cron.use_background_workers = on
cron.timezone = 'UTC'
cron.log_statement = off
cron.log_run = on

# ------------------------------------------------------------------------------
# Memory & Cache Sizing (Tuned for 4GB - 8GB VPS RAM Baseline)
# ------------------------------------------------------------------------------
shared_buffers = 1GB                    # 25% of 4GB RAM
effective_cache_size = 3GB              # 75% of 4GB RAM
maintenance_work_mem = 256MB
work_mem = 10MB
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# ------------------------------------------------------------------------------
# Write-Ahead Logging (WAL) & pgBackRest Continuous Archiving
# ------------------------------------------------------------------------------
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=scheduler_db archive-push %p'
archive_timeout = 300
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 512MB

# ------------------------------------------------------------------------------
# Query Planner & Cost Tuning
# ------------------------------------------------------------------------------
random_page_cost = 1.1                  # NVMe SSD optimized
effective_io_concurrency = 200          # High-speed VPS NVMe drive
default_statistics_target = 100

# ------------------------------------------------------------------------------
# Logging & Audit Configuration (Defense-in-Depth PII Protection)
# ------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 250        # Log slow queries >= 250ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'UTC'

# ------------------------------------------------------------------------------
# Locale and Formatting
# ------------------------------------------------------------------------------
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'
