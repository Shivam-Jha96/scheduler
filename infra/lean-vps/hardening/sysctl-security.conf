# ==============================================================================
# sysctl-security.conf - Linux Kernel & Network Stack Hardening
# Lean VPS Zero-Trust Ingress Profile (EP14-T1a / FR-NET-01 / FR-NET-02)
# ==============================================================================
# Hardens the Linux TCP/IP network stack against SYN floods, spoofing,
# routing anomalies, and denial-of-service, while tuning UDP socket buffers
# for Cloudflare QUIC (HTTP/3) tunnel throughput.
# Apply via: sysctl -p /etc/sysctl.d/99-security-hardening.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. TCP SYN Flood Protection & Connection Security
# ------------------------------------------------------------------------------
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_rfc1337 = 1

# ------------------------------------------------------------------------------
# 2. IP Spoofing & Reverse Path Filtering (Strict Source Validation)
# ------------------------------------------------------------------------------
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ------------------------------------------------------------------------------
# 3. Source Routing & ICMP Redirect Disablement
# ------------------------------------------------------------------------------
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# ------------------------------------------------------------------------------
# 4. ICMP Flood & Broadcast Smurf Protection
# ------------------------------------------------------------------------------
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ------------------------------------------------------------------------------
# 5. Kernel Self-Protection & Memory Disclosure Restrictions
# ------------------------------------------------------------------------------
fs.suid_dumpable = 0
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.randomize_va_space = 2
kernel.yama.ptrace_scope = 2
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# ------------------------------------------------------------------------------
# 6. UDP Buffer Tuning for Cloudflare QUIC (HTTP/3) Tunnel Throughput
# ------------------------------------------------------------------------------
# Prevents packet drops under bursty webhook delivery on UDP port 7844
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.netdev_max_backlog = 10000
